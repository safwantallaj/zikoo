<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المحاسب الذكي | Smart Ledger Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
      --success: #10b981; --success-light: #ecfdf5; --danger: #ef4444;
      --danger-light: #fef2f2; --warning: #f59e0b; --warning-light: #fffbeb;
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-muted: #64748b;
      --border: #e2e8f0; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: var(--card); position: relative; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.06); }
    #license-banner { background: var(--success-light); border-bottom: 1px solid #a7f3d0; padding: 8px 14px; font-size: 11px; font-weight: 700; color: #065f46; display: flex; justify-content: space-between; align-items: center; }
    header { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 50; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .brand-title { font-size: 18px; font-weight: 800; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .currency-badge { display: flex; align-items: center; gap: 4px; background: var(--primary-light); padding: 5px 10px; border-radius: 20px; font-size: 12px; color: var(--primary-dark); font-weight: 700; cursor: pointer; border: 1px solid #bfdbfe; }
    main { flex: 1; padding: 20px; padding-bottom: 95px; overflow-y: auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .hero-balance { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 22px; border-radius: var(--radius); margin-bottom: 18px; }
    .hero-title { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .hero-value { font-size: 28px; font-weight: 800; }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .stat-card { background: var(--bg); padding: 14px; border-radius: 14px; border: 1px solid var(--border); }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .stat-val { font-size: 16px; font-weight: 700; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    input, select, textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: white; color: var(--text); outline: none; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #334155; color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-scan { background: linear-gradient(135deg, #10b981, #059669); color: white; margin-bottom: 14px; }
    .btn-outline { background: transparent; border: 1px dashed var(--primary); color: var(--primary); margin-bottom: 14px; padding: 10px; font-size: 13px; }
    .settings-card, .report-card, .invoice-card { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .statement-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
    .statement-table th { background: #f1f5f9; padding: 10px; text-align: right; color: var(--text-muted); font-weight: 600; }
    .statement-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
    nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; height: 68px; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; flex: 1; padding: 6px 0; }
    .nav-item i { font-size: 17px; }
    .nav-item.active { color: var(--primary); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 99; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex !important; }
    .modal-panel { background: white; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 22px; max-height: 88vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<div class="app-container">
  <div id="license-banner">
    <div><i class="fa-solid fa-crown" style="color:#10b981;"></i> <span>النسخة الدائمة (PRO)</span></div>
  </div>
  
  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-calculator"></i></div>
      <div class="brand-title">المحاسب الذكي</div>
    </div>
    <div class="header-actions">
      <button class="currency-badge" onclick="triggerCloudSync()"><i class="fa-solid fa-cloud-arrow-down"></i> <span>مزامنة</span></button>
    </div>
  </header>

  <main>
    <!-- الرئيسية -->
    <div id="tab-home" class="tab-content active">
      <div class="hero-balance">
        <div class="hero-title">السيولة النقدية المتاحة</div>
        <div class="hero-value"><span id="dash-cash">0.00</span> <span class="curr-symbol">ر.س</span></div>
      </div>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">ديون العملاء</div><div class="stat-val" id="dash-customers">0.00</div></div>
        <div class="stat-card"><div class="stat-label">ديون الموردين</div><div class="stat-val" id="dash-vendors">0.00</div></div>
      </div>
    </div>

    <!-- التقارير -->
    <div id="tab-statement" class="tab-content">
      <div class="form-group"><label>اختر الحساب</label><select id="statement-account-selector" class="account-selector" onchange="loadStatementData()"></select></div>
      <table class="statement-table">
        <thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
        <tbody id="statement-rows"></tbody>
      </table>
    </div>

    <!-- الإعدادات -->
    <div id="tab-settings" class="tab-content">
      <h3 style="margin-bottom: 14px; font-size: 18px;">الإعدادات والربط السحابي</h3>
      <div class="settings-card">
        <div class="form-group"><label>معرّف الشيت (Google Sheet ID)</label><input type="text" id="set-sheet-id" placeholder="الصق معرّف الشيت هنا"></div>
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="set-owner-email" placeholder="email@gmail.com"></div>
        <button class="btn btn-primary" onclick="saveSheetIdManually()"><i class="fa-solid fa-floppy-disk"></i> حفظ وربط الشيت</button>
      </div>
      <div class="settings-card">
        <button class="btn btn-secondary" onclick="triggerCloudSync()"><i class="fa-solid fa-cloud-arrow-down"></i> مزامنة وسحب الحركات</button>
      </div>
    </div>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab('tab-home')"><i class="fa-solid fa-house"></i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="switchTab('tab-statement')"><i class="fa-solid fa-chart-pie"></i><span>التقارير</span></div>
    <div class="nav-item" onclick="switchTab('tab-settings')"><i class="fa-solid fa-sliders"></i><span>الإعدادات</span></div>
  </nav>
</div>
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4KelOxUEpf8grAQ_Ax0EuZQnIEwOV_do-EsfkORQ6R8lUWISqL8eU-NWiwTEPK-4O/exec";

  function showToast(message, isError) {
    let toast = document.getElementById("appToast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "appToast";
      toast.style.cssText = "position:fixed; bottom:25px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:12px 24px; border-radius:30px; font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; z-index:2147483647; transition:all 0.3s ease; opacity:0; pointer-events:none; text-align:center;";
      document.body.appendChild(toast);
    }
    toast.style.background = isError ? "#ef4444" : "#10b981";
    toast.textContent = message;
    toast.style.opacity = "1";
    setTimeout(function() { toast.style.opacity = "0"; }, 3200);
  }

  let chartOfAccounts = [
    { code: "1111", name: "الصندوق الرئيسي", base: "cash", nature: "مدين" },
    { code: "1113", name: "الحساب البنكي", base: "bank", nature: "مدين" },
    { code: "1121", name: "العملاء", base: "customer", nature: "مدين" },
    { code: "2101", name: "الموردين", base: "vendor", nature: "دائن" },
    { code: "4101", name: "المبيعات", base: "revenue", nature: "دائن" },
    { code: "5101", name: "تكلفة المبيعات", base: "expense", nature: "مدين" }
  ];
  
  let ledgerEntries = JSON.parse(localStorage.getItem('smart_entries') || '[]');

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    
    if(tabId === 'tab-home') document.querySelectorAll('.nav-item')[0].classList.add('active');
    if(tabId === 'tab-statement') { 
      document.querySelectorAll('.nav-item')[1].classList.add('active'); 
      loadStatementData(); 
    }
    if(tabId === 'tab-settings') { 
      document.querySelectorAll('.nav-item')[2].classList.add('active'); 
      updateLicenseUI(); 
    }
  }

  function updateLicenseUI() {
    if(document.getElementById('set-owner-email')) document.getElementById('set-owner-email').value = localStorage.getItem('user_owner_email') || '';
    if(document.getElementById('set-sheet-id')) document.getElementById('set-sheet-id').value = localStorage.getItem('user_sheet_id') || '';
  }

  function saveSheetIdManually() {
    const sht = document.getElementById('set-sheet-id').value.trim();
    const own = document.getElementById('set-owner-email').value.trim();
    if (!sht) { alert('يرجى إدخال معرّف الشيت أولاً'); return; }
    localStorage.setItem('user_sheet_id', sht);
    if(own) localStorage.setItem('user_owner_email', own);
    alert('تم حفظ معرّف الشيت بنجاح ✅');
    triggerCloudSync();
  }

  async function triggerCloudSync() {
    var sheetId = localStorage.getItem('user_sheet_id');
    if (!sheetId) { alert('يرجى إدخال وتثبيت معرّف الشيت في الإعدادات أولاً'); return; }
    alert('جاري مزامنة وسحب الحركات من Google Sheet...');
    try {
      var response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "SYNC_PULL_DATA", spreadsheetId: sheetId })
      });
      var res = await response.json();
      if (res.status === "success") {
        if (res.entries) {
          ledgerEntries = res.entries;
          localStorage.setItem('smart_entries', JSON.stringify(ledgerEntries));
        }
        updateDashboardStats();
        alert('اكتملت المزامنة وسحب الحركات بنجاح ✅');
      } else {
        throw new Error(res.message || 'خطأ غير معروف في المزامنة');
      }
    } catch (e) {
      alert('خطأ في الاتصال بالمزامنة: ' + e.message);
    }
  }

  function updateDashboardStats() {
    let cash = 0, cust = 0, vend = 0;
    ledgerEntries.forEach(e => {
      let d = Number(e.debit) || 0, c = Number(e.credit) || 0;
      if (e.accountCode && e.accountCode.startsWith("111")) cash += (d - c);
      else if (e.accountCode && e.accountCode.startsWith("112")) cust += (d - c);
      else if (e.accountCode && e.accountCode.startsWith("210")) vend += (c - d);
    });
    if (document.getElementById('dash-cash')) document.getElementById('dash-cash').innerText = cash.toFixed(2);
    if (document.getElementById('dash-customers')) document.getElementById('dash-customers').innerText = Math.max(0, cust).toFixed(2);
    if (document.getElementById('dash-vendors')) document.getElementById('dash-vendors').innerText = Math.max(0, vend).toFixed(2);
  }

  function loadStatementData() {
    var sel = document.getElementById('statement-account-selector');
    if (!sel) return;
    if(sel.options.length === 0) {
      sel.innerHTML = chartOfAccounts.map(a => `<option value="${a.code}">${a.code} - ${a.name}</option>`).join('');
    }
    var code = sel.value;
    var tbody = document.getElementById('statement-rows');
    if (!tbody) return;
    tbody.innerHTML = '';
    let bal = 0;
    ledgerEntries.filter(e => String(e.accountCode) === String(code)).forEach(item => {
      bal += (Number(item.debit) || 0) - (Number(item.credit) || 0);
      let tr = document.createElement('tr');
      tr.innerHTML = `<td>${item.date || ''}</td><td>${item.desc || ''}</td><td>${item.debit || '-'}</td><td>${item.credit || '-'}</td><td>${bal.toFixed(2)}</td>`;
      tbody.appendChild(tr);
    });
  }

  window.addEventListener('DOMContentLoaded', function() {
    updateDashboardStats();
    updateLicenseUI();
  });
</script>
